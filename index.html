<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDS Loadout Randomizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        accent: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 10px #38bdf8, 0 0 20px #0ea5e9',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        /* Checkbox styling */
        .tower-checkbox:checked + div {
            background-color: rgba(14, 165, 233, 0.2);
            border-color: #38bdf8;
            color: #f8fafc;
        }
        .tower-checkbox:checked + div .check-icon {
            opacity: 1;
        }
        .card-enter {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="bg-gray-800 border-b border-gray-700 p-6 shadow-md text-center sticky top-0 z-20">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-accent-400 to-blue-600">
            <i class="fa-solid fa-shield-halved mr-2 text-accent-500"></i>TDS Randomizer
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">Generate your ultimate Tower Defense Simulator loadout</p>
    </header>

    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left/Top Column: Loadout Display & Controls -->
        <div class="lg:col-span-1 flex flex-col gap-6 sticky top-28 h-fit">
            
            <!-- Result Area -->
            <div class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center text-accent-400">
                    <i class="fa-solid fa-crosshairs mr-2"></i> Your Loadout
                </h2>
                
                <div id="loadout-container" class="grid grid-cols-1 gap-3 mb-6">
                    <!-- Placeholder Slots -->
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center justify-center h-16 text-gray-500 italic">Slot 1</div>
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center justify-center h-16 text-gray-500 italic">Slot 2</div>
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center justify-center h-16 text-gray-500 italic">Slot 3</div>
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center justify-center h-16 text-gray-500 italic">Slot 4</div>
                    <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 flex items-center justify-center h-16 text-gray-500 italic">Slot 5</div>
                </div>

                <!-- Generate Button -->
                <button id="generate-btn" class="w-full py-4 bg-gradient-to-r from-accent-600 to-blue-700 hover:from-accent-500 hover:to-blue-600 text-white font-bold rounded-lg shadow-lg transition-all transform hover:-translate-y-1 hover:shadow-neon focus:outline-none focus:ring-4 focus:ring-accent-500 focus:ring-opacity-50">
                    GENERATE LOADOUT
                </button>
            </div>

            <!-- Global Controls -->
            <div class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
                <h2 class="text-lg font-bold mb-4 text-gray-200">Global Pool Controls</h2>
                <div class="flex gap-2">
                    <button id="select-all-btn" class="flex-1 py-2 bg-gray-700 hover:bg-gray-600 rounded transition text-sm font-semibold">
                        Select All
                    </button>
                    <button id="deselect-all-btn" class="flex-1 py-2 bg-gray-700 hover:bg-gray-600 rounded transition text-sm font-semibold">
                        Deselect All
                    </button>
                </div>
            </div>
        </div>

        <!-- Right/Bottom Column: Pool Selection -->
        <div class="lg:col-span-2">
            <div class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
                <h2 class="text-2xl font-bold mb-6 flex items-center border-b border-gray-700 pb-4">
                    <i class="fa-solid fa-list-check mr-3 text-accent-500"></i> Tower Pool
                </h2>
                
                <div id="pool-container" class="space-y-8">
                    <!-- Categories will be injected here via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Error Toast/Modal -->
    <div id="error-toast" class="fixed bottom-4 right-4 bg-red-900 border-l-4 border-red-500 text-red-100 p-4 rounded shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
        <i class="fa-solid fa-triangle-exclamation text-2xl mr-3"></i>
        <div>
            <h4 class="font-bold">Not Enough Towers</h4>
            <p class="text-sm" id="error-msg">Please select at least 5 towers to generate a loadout.</p>
        </div>
    </div>

    <script>
        const towerData = {
            "Starter": ["Scout", "Sniper", "Paintballer", "Demoman","Boomerang", "Slime Trooper", "Soldier" ],
            "Intermediate": ["Hunter","Assassin", "Militant", "Medic", "Freezer", "Farm", "Shotgunner", "Trapper", "Pyromacer", "Electroshocker", "Ace Pilot",
                "Military base", "Rocketeer" ,"Pulse Trooper", "Crook Boss"
            ],
            "Advanced": ["Minigunner", "Ranger", "Commander", "DJ Booth", "Warden", "Turret", "Pursuit", "Mortar", "Cowboy"
                , "Tesls" , "Saboteur" , "Mercenary Base", "Gatling"
            ],
            "Hardcore": ["Accelerator", "Engineer", "Brawler", "Necromancer","Hacker", "Time Dilator"],
            "Golden" : ["G-Minigunner", "G-CrookBoss", "G-Pyro", "G-Scout" ,"G-Demoman","G-Soldier"],
            "Evole" : ["Operator", "Enforcer", "Kingpin", "Juggernaut", "Enforcer"],
            "Event/Exclusive": ["Gladiator", "Commando", "Slasher", "Frost Blaster", "Archer", "Toxic Gunner",
             "Swarmer", "Sledger", "Executioner", "Elf Camp", "Jester", "Cryomancer",
            "Hallow Punk" , "Harvester", "Snowballer", "Elemetalist" , "Firework Technician", "Biologist" , "Warlock", "Spotlight Technician", "Star Cannon"]
        };

        const categoryColors = {
            "Starter": "text-green-400 border-green-500",
            "Intermediate": "text-blue-400 border-blue-500",
            "Advanced": "text-red-400 border-red-500",
            "Hardcore": "text-purple-400 border-purple-500",
            "Golden" : "text-yellow-400 border-yellow-500",
            "Evole" : "text-purple-400 border-purple-500",
            "Event/Exclusive": "text-pink-400 border-pink-500"
        };

        const poolContainer = document.getElementById('pool-container');
        const loadoutContainer = document.getElementById('loadout-container');
        const generateBtn = document.getElementById('generate-btn');
        const selectAllBtn = document.getElementById('select-all-btn');
        const deselectAllBtn = document.getElementById('deselect-all-btn');
        const errorToast = document.getElementById('error-toast');

        let errorTimeout;

        function initPool() {
            for (const [category, towers] of Object.entries(towerData)) {
                const categoryColorClass = categoryColors[category] || "text-accent-400 border-accent-500";
                const colorCode = categoryColorClass.split(' ')[0]; // Gets the text-color part

                const section = document.createElement('div');
                section.className = 'category-section';

                // Category Header
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-4';
                header.innerHTML = `
                    <h3 class="text-lg font-bold ${colorCode} uppercase tracking-wider">${category}</h3>
                    <div class="flex gap-2">
                        <button class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition" onclick="toggleCategory('${category}', true)">All</button>
                        <button class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition" onclick="toggleCategory('${category}', false)">None</button>
                    </div>
                `;
                section.appendChild(header);

                // Grid of Towers
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3';

                towers.forEach(tower => {
                    const towerId = `tower-${tower.replace(/\s+/g, '-').toLowerCase()}`;
                    const label = document.createElement('label');
                    label.className = 'cursor-pointer relative block group';
                    
                    label.innerHTML = `
                        <input type="checkbox" class="tower-checkbox hidden category-${category.replace(/\s+/g, '-')}" value="${tower}" checked>
                        <div class="border border-gray-600 bg-gray-900 rounded p-3 flex items-center justify-between transition-all duration-200 group-hover:border-gray-400 text-sm text-gray-300">
                            <span class="truncate font-medium">${tower}</span>
                            <i class="fa-solid fa-check check-icon opacity-0 text-accent-400 transition-opacity"></i>
                        </div>
                    `;
                    grid.appendChild(label);
                });

                section.appendChild(grid);
                poolContainer.appendChild(section);
            }
        }

        function toggleCategory(category, state) {
            const safeCategory = category.replace(/\s+/g, '-');
            const checkboxes = document.querySelectorAll(`.category-${safeCategory}`);
            checkboxes.forEach(cb => {
                cb.checked = state;
            });
        }

        selectAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.tower-checkbox').forEach(cb => cb.checked = true);
        });

        deselectAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.tower-checkbox').forEach(cb => cb.checked = false);
        });

        function showError(message) {
            document.getElementById('error-msg').innerText = message;
            errorToast.classList.remove('translate-y-20', 'opacity-0');
            
            clearTimeout(errorTimeout);
            errorTimeout = setTimeout(() => {
                errorToast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function generateLoadout() {
            const checkboxes = document.querySelectorAll('.tower-checkbox:checked');
            const selectedTowers = Array.from(checkboxes).map(cb => cb.value);

            if (selectedTowers.length < 5) {
                showError(`Please select at least 5 towers. You currently have ${selectedTowers.length} selected.`);
                return;
            }

            // Shuffle array (Fisher-Yates)
            for (let i = selectedTowers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [selectedTowers[i], selectedTowers[j]] = [selectedTowers[j], selectedTowers[i]];
            }

            const chosenTowers = selectedTowers.slice(0, 5);
            displayLoadout(chosenTowers);
        }

        function displayLoadout(towers) {
            loadoutContainer.innerHTML = '';
            
            towers.forEach((tower, index) => {
                // Find category to match color roughly
                let matchedCategory = "Starter";
                for (const [cat, list] of Object.entries(towerData)) {
                    if (list.includes(tower)) {
                        matchedCategory = cat;
                        break;
                    }
                }
                
                const borderColor = categoryColors[matchedCategory] ? categoryColors[matchedCategory].split(' ')[1] : 'border-accent-500';

                const slot = document.createElement('div');
                // Apply animation and distinct styling
                slot.className = `card-enter bg-gray-800 border-l-4 ${borderColor} rounded-r-lg p-4 flex items-center shadow-md border-y border-r border-y-gray-700 border-r-gray-700`;
                slot.style.animationDelay = `${index * 0.1}s`;
                
                slot.innerHTML = `
                    <div class="bg-gray-900 h-10 w-10 rounded flex items-center justify-center mr-4 border border-gray-700">
                        <i class="fa-solid fa-tower-observation text-gray-400"></i>
                    </div>
                    <span class="font-bold text-lg text-white">${tower}</span>
                `;
                
                loadoutContainer.appendChild(slot);
            });
        }

        generateBtn.addEventListener('click', generateLoadout);

        // Initialize App
        initPool();

    </script>
</body>
</html>
